{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{% static 'core/images/favicon.png'%}">
  <title>EduCore|{% block title %}{% endblock title %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">Edu<span>Core</span>
        <img src="{% static 'core/images/favicon.png' %}" alt="brand-img" width="50" height="50">
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-label="Toggle navigation">
        <i class="bi bi-list text-white fs-4"></i>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto gap-1">
          <li class="nav-item"><a class="nav-link px-3" href="#features">Features</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#modules">Modules</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#testimonials">Reviews</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#pricing">Pricing</a></li>
        </ul>
        <div class="d-flex gap-2 mt-3 mt-lg-0">
          {% if user.is_authenticated %}
          <a href="{% url 'logoutview' %}" class="nav-link px-3">Logout</a>
          {% else %}
          <a href="{% url 'loginview' %}" class="nav-link px-3">Login</a>
          <a href="{% url 'registerview' %}" class="nav-link px-3">Register</a>
          {% endif %}
          <a href="#" class="btn-nav">Start Free Trial</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container base-container">

    {% block main_content %} {% endblock main_content%}

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
